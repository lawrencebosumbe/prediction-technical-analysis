[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-technical-analysis"
version = "0.1.0"
description = "A reproducible, CSV-first technical analysis and strategy research toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "statsmodels>=0.14", "lightgbm>=4.0", "xgboost>=2.0"]
data = ["yfinance>=0.2"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "pre-commit>=3.6", "build>=1.0"]
all = ["scikit-learn>=1.3", "statsmodels>=0.14", "lightgbm>=4.0", "xgboost>=2.0", "yfinance>=0.2"]

[project.scripts]
tpta = "tpta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tpta = ["resources/raw/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

